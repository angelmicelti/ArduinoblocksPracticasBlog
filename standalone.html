        // State
        let currentSearch = "";

        // UI Elements
        const practicesContainer = document.getElementById('practicesContainer');
        const searchInput = document.getElementById('searchInput');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModal = document.getElementById('closeModal');
        
        const modalTitle = document.getElementById('modalTitle');
        const modalCategory = document.getElementById('modalCategory');
        const modalCriteria = document.getElementById('modalCriteria');
        const modalBlogLink = document.getElementById('modalBlogLink');

        function render() {
            practicesContainer.innerHTML = "";
            const filteredPractices = PRACTICES.filter(p => 
                p.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
                p.id.toLowerCase().includes(currentSearch.toLowerCase()) ||
                p.category.toLowerCase().includes(currentSearch.toLowerCase())
            );

            CATEGORIES.forEach(cat => {
                const items = filteredPractices.filter(p => p.category === cat);
                if (items.length === 0) return;

                const section = document.createElement('div');
                section.className = 'category-section';
                
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `<h2>${cat}</h2><div class="category-line"></div>`;
                
                const grid = document.createElement('div');
                grid.className = 'practice-grid';

                items.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <span class="card-id">${p.id}</span>
                            <div class="card-title">${p.title}</div>
                        </div>
                    `;
                    card.onclick = () => showModal(p);
                    grid.appendChild(card);
                });

                section.appendChild(header);
                section.appendChild(grid);
                practicesContainer.appendChild(section);
            });
        }

        function showModal(practice) {
            modalTitle.innerText = practice.title;
            modalCategory.innerText = practice.category;
            modalBlogLink.href = practice.blogUrl;
            
            modalCriteria.innerHTML = "";
            practice.criteria.forEach(critId => {
                const crit = EVALUATION_CRITERIA.find(c => c.id === critId);
                if (crit) {
                    const item = document.createElement('div');
                    item.className = 'criterion-item';
                    item.innerHTML = `
                        <span class="criterion-id">${crit.id}</span>
                        <div>${crit.description}</div>
                    `;
                    modalCriteria.appendChild(item);
                }
            });

            modalOverlay.style.display = 'flex';
        }

        searchInput.oninput = (e) => {
            currentSearch = e.target.value;
            render();
        };

        closeModal.onclick = () => {
            modalOverlay.style.display = 'none';
        };

        window.onclick = (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        };

        // Initial render
        render();
    </script>
